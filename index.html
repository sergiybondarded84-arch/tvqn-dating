<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVQN Dating Platform</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid #2a2a2a;
    }
    h1 { color: #f3ba2f; margin-bottom: 6px; font-size: 24px; }
    p { color: #aaa; font-size: 13px; margin-top: 0; }
    .profile-card {
      background: #262626;
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #333;
    }
    .avatar-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #333;
    }
    .btn {
      background: #f3ba2f;
      color: #000;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }
    .stat-val { color: #f3ba2f; font-weight: bold; font-size: 18px; }
    .stat-lbl { color: #888; font-size: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>TVQN Dating</h1>
    <p>Платформа знайомств майбутнього</p>

    <div class="profile-card">
      <img id="user-photo" class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Аватар">
      <h3 id="user-name" style="margin: 5px 0;">Анна, 24</h3>
      <p id="user-city">Київ • Шукає спілкування</p>
    </div>

    <div class="stats">
      <div>
        <div class="stat-val" id="likes-count">12</div>
        <div class="stat-lbl">Вподобання</div>
      </div>
      <div>
        <div class="stat-val" id="bal-count">500</div>
        <div class="stat-lbl">TVQN Монет</div>
      </div>
    </div>

    <button id="like-btn" class="btn" onclick="likeProfile()">Вподобати профіль ❤️</button>
    <button id="next-btn" class="btn btn-secondary" onclick="nextProfile()">Наступна анкета ➡️</button>
  </div>

  <script>
    const profiles = [
      { name: "Анна, 24", city: "Київ • Шукає спілкування", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" },
      { name: "Олена, 22", city: "Львів • Подорожі та крипта", photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" },
      { name: "Марія, 25", city: "Одеса • Web3 ентузіаст", photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500" }
    ];
    let current = 0;
    let likes = 12;
    let balance = 500;

    function nextProfile() {
      current = (current + 1) % profiles.length;
      document.getElementById('user-name').textContent = profiles[current].name;
      document.getElementById('user-city').textContent = profiles[current].city;
      document.getElementById('user-photo').src = profiles[current].photo;
    }

    function likeProfile() {
      likes++;
      balance += 50;
      document.getElementById('likes-count').textContent = likes;
      document.getElementById('bal-count').textContent = balance;
      nextProfile();
    }
  </script>

</body>
</html>
